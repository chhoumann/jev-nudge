[project]
name = "jev-nudge"
version = "0.1.0"
description = "A Jev-powered Codex Stop hook for unfinished work."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jev-nudge = "jev_nudge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
exclude-newer = "7 days"
